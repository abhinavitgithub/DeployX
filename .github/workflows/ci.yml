name: DeployX CI Pipeline

"on":
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Code Linting & Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"

      - name: Install Ruff Linter
        run: pip install --no-cache-dir ruff==0.9.10

      - name: Run Ruff Lint Checks
        run: ruff check backend/ tests/ frontend/

      - name: Run Ruff Format Verification
        run: ruff format --check backend/ tests/ frontend/

      - name: Validate Git Whitespace & Formatting
        run: git diff --check

  test-python-suite:
    name: Pytest Automated Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pyyaml ruff anyio httpx

      - name: Execute Full Pytest Suite
        run: pytest -v backend/tests/ tests/

  test-frontend-scripts:
    name: Frontend Unit & Parser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "20"

      - name: Run Prometheus Parser Unit Tests
        run: node frontend/test_api_parser.js

      - name: Run Sidebar Navigation Unit Tests
        run: node frontend/test_navigation.js

  test-kubernetes-manifests:
    name: Kubernetes Manifest Dry-Run Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Kind Cluster for Schema Discovery
        run: |
          if ! command -v kind >/dev/null 2>&1; then
            curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
            chmod +x ./kind
            sudo mv ./kind /usr/local/bin/kind
          fi
          kind create cluster --name ci-validation --wait 60s

      - name: Dry-Run Validate Kubernetes Manifests
        run: |
          kubectl apply --dry-run=client -f infrastructure/kubernetes/namespace.yaml
          kubectl apply --dry-run=client -f infrastructure/kubernetes/configmap.yaml
          kubectl apply --dry-run=client -f infrastructure/kubernetes/storage.yaml
          kubectl apply --dry-run=client -f infrastructure/kubernetes/backend.yaml
          kubectl apply --dry-run=client -f infrastructure/kubernetes/backend-green.yaml
          kubectl apply --dry-run=client -f infrastructure/kubernetes/backend-alias.yaml
          kubectl apply --dry-run=client -f infrastructure/kubernetes/frontend.yaml
          kubectl apply --dry-run=client -f infrastructure/kubernetes/ingress.yaml

      - name: Dry-Run Validate Monitoring Manifests
        run: |
          kubectl apply --dry-run=client -f infrastructure/monitoring/prometheus.yaml
          kubectl apply --dry-run=client -f infrastructure/monitoring/grafana.yaml
