name: Production Release & Immutable Versioning

"on":
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Semantic version tag to release (e.g. v1.1.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as a pre-release"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  verify-release-prerequisites:
    name: Verify Release Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"

      - name: Run Test Quality Gate
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pyyaml ruff anyio httpx
          ruff check backend/ tests/ frontend/
          pytest -v backend/tests/ tests/

  publish-release-images:
    name: Publish Immutable Images (${{ matrix.service }})
    needs: verify-release-prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        include:
          - service: backend
            context: backend
            dockerfile: backend/Dockerfile
            image_name: deployx-backend
          - service: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            image_name: deployx-frontend

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Release Tag
        id: tag_resolver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version_tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Extract Release Metadata & Immutable Tags
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=${{ steps.tag_resolver.outputs.release_tag }}
            type=semver,pattern={{version}},value=${{ steps.tag_resolver.outputs.release_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag_resolver.outputs.release_tag }}
            type=semver,pattern={{major}},value=${{ steps.tag_resolver.outputs.release_tag }}
            type=raw,value=latest

      - name: Build & Publish Immutable Release Image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  create-github-release:
    name: Publish Official GitHub Release
    needs: [verify-release-prerequisites, publish-release-images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve Release Tag
        id: tag_resolver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version_tag }}"
            IS_PRE="${{ inputs.prerelease }}"
          else
            TAG="${{ github.ref_name }}"
            IS_PRE=false
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$IS_PRE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with Automatic Notes
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87238600630b76e01dcea # v2.2.1
        with:
          tag_name: ${{ steps.tag_resolver.outputs.tag }}
          name: "DeployX Release ${{ steps.tag_resolver.outputs.tag }}"
          draft: false
          prerelease: ${{ steps.tag_resolver.outputs.prerelease == 'true' }}
          generate_release_notes: true
