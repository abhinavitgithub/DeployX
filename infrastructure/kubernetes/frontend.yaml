apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployx-frontend
  namespace: deployx
  labels:
    app: deployx-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deployx-frontend
  template:
    metadata:
      labels:
        app: deployx-frontend
    spec:
      containers:
        - name: frontend
          image: deployx-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: deployx-frontend
  namespace: deployx
spec:
  type: NodePort
  selector:
    app: deployx-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
      protocol: TCP
