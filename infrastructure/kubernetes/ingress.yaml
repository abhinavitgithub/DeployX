apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deployx-ingress
  namespace: deployx
  labels:
    app.kubernetes.io/name: deployx
    app.kubernetes.io/part-of: deployx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: deployx-frontend
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
