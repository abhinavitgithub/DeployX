apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployx-backend-green
  namespace: deployx
  labels:
    app: deployx-backend
    deployment-color: green
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deployx-backend
      deployment-color: green
  template:
    metadata:
      labels:
        app: deployx-backend
        deployment-color: green
    spec:
      containers:
        - name: backend
          image: deployx-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
