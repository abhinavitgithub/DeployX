apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: deployx
  labels:
    app: deployx-backend
    app.kubernetes.io/part-of: deployx
spec:
  type: ClusterIP
  selector:
    app: deployx-backend
    deployment-color: blue
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
