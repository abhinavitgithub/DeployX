apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployx-grafana
  namespace: deployx
  labels:
    app: deployx-grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: deployx
    app.kubernetes.io/component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deployx-grafana
  template:
    metadata:
      labels:
        app: deployx-grafana
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: deployx
        app.kubernetes.io/component: monitoring
    spec:
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        runAsNonRoot: true
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: deployx-grafana-secret
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: deployx-grafana-secret
                  key: admin-password
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_INSTALL_PLUGINS
              value: ""
          ports:
            - name: http-grafana
              containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http-grafana
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http-grafana
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: datasources-volume
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider-volume
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards-volume
              mountPath: /var/lib/grafana/dashboards
            - name: storage-volume
              mountPath: /var/lib/grafana
      volumes:
        - name: datasources-volume
          configMap:
            name: deployx-grafana-datasources
        - name: dashboard-provider-volume
          configMap:
            name: deployx-grafana-dashboard-provider
        - name: dashboards-volume
          configMap:
            name: deployx-grafana-dashboards
        - name: storage-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: deployx
  labels:
    app: deployx-grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: deployx
    app.kubernetes.io/component: monitoring
spec:
  type: ClusterIP
  selector:
    app: deployx-grafana
  ports:
    - name: http-grafana
      port: 3000
      targetPort: http-grafana
      protocol: TCP
---
